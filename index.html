<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>色聴（共感覚）トレーニング</title>
    <style>
        :root {
            --bg-color: #111;
            --text-color: #fff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.1s ease;
            overflow: hidden;
        }
        #ui-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.1s ease;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            text-align: center;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            cursor: pointer;
        }
        button:active { background: #444; }
        
        .notes-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        .note-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid transparent;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none; /* スマホでのスクロール防止 */
            transition: transform 0.1s;
        }
        .note-btn:active {
            transform: scale(0.9);
        }

        /* 各種状態のスタイル */
        /* 1. 通常トレーニングモード（ボタンに色がつく） */
        body[data-mode="train"] .note-btn {
            color: #000;
        }
        body[data-mode="train"][data-immersion="true"] .note-btn {
            background-color: #000 !important;
            border-color: #fff;
            color: #fff;
        }
        body[data-mode="train"][data-playing="true"][data-immersion="true"] .controls {
            opacity: 0; /* 没入モード発音中はUIを消す */
        }

        /* 2. クイズモード共通（ボタンは白黒固定でネタバレ防止） */
        body[data-mode^="quiz"] .note-btn {
            background-color: #000 !important;
            border-color: #fff;
            color: #fff;
        }

        #quiz-status {
            font-size: 20px;
            font-weight: bold;
            height: 30px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body data-mode="train" data-immersion="false" data-playing="false">

    <div id="ui-container">
        <div class="controls">
            <h2>色聴トレーニング</h2>
            
            <!-- 修正：追加される音が分かるようにテキストを変更 -->
            <select id="noteCountSelect">
                <option value="2">レベル1: 2音（C, F# / 色相環の真裏）</option>
                <option value="3">レベル2: 3音（+ D# 追加）</option>
                <option value="4">レベル3: 4音（+ A 追加 / 十字完成）</option>
                <option value="5">レベル4: 5音（+ E 追加）</option>
                <option value="6">レベル5: 6音（+ A# 追加 / Eの真裏）</option>
                <option value="7">レベル6: 7音（+ C# 追加）</option>
                <option value="8">レベル7: 8音（+ G 追加 / C#の真裏）</option>
                <option value="9">レベル8: 9音（+ D 追加）</option>
                <option value="10">レベル9: 10音（+ G# 追加 / Dの真裏）</option>
                <option value="11">レベル10: 11音（+ F 追加）</option>
                <option value="12" selected>レベルMAX: 12音（+ B 追加 / 全12音完了）</option>
            </select>

            <select id="modeSelect">
                <option value="train">1. トレーニング (自由押し)</option>
                <option value="quiz_sound">2. クイズ: 音 → 色(音)を当てる</option>
                <option value="quiz_color">3. クイズ: 色 → 音を当てる</option>
            </select>
            
            <label id="immersionLabel">
                <input type="checkbox" id="immersionToggle"> 没入モード (発音中UI非表示＆全画面色)
            </label>

            <button id="actionBtn" style="display: none;">問題を出す</button>
            <div id="quiz-status"></div>
        </div>

        <div class="notes-grid" id="notesGrid"></div>
    </div>

    <script>
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        // C=0度(赤), C#=30度... 30度ずつ回転
        const hues = notes.map((_, i) => i * 30);
        
        // 修正：前に覚えた音を維持したまま、常に最も遠い隙間（またはその増4度の対極）を1音ずつ足していく一貫したロジック
        const levelPatterns = {
            2: [0, 6],                      // C, F# (増4度・真裏)
            3: [0, 6, 3],                   // + D# (十字の半分)
            4: [0, 6, 3, 9],                // + A (十字が完成)
            5: [0, 6, 3, 9, 4],             // + E
            6: [0, 6, 3, 9, 4, 10],         // + A# (Eの真裏)
            7: [0, 6, 3, 9, 4, 10, 1],      // + C# 
            8: [0, 6, 3, 9, 4, 10, 1, 7],   // + G (C#の真裏)
            9: [0, 6, 3, 9, 4, 10, 1, 7, 2],    // + D
            10: [0, 6, 3, 9, 4, 10, 1, 7, 2, 8],// + G# (Dの真裏)
            11: [0, 6, 3, 9, 4, 10, 1, 7, 2, 8, 5],     // + F
            12: [0, 6, 3, 9, 4, 10, 1, 7, 2, 8, 5, 11]  // + B (Fの真裏・全12音完了)
        };

        let activeNotes = levelPatterns[12]; // 現在有効な音のインデックス配列

        let audioCtx;
        let currentOsc = null;
        let currentGain = null;

        const noteCountSelect = document.getElementById('noteCountSelect');
        const modeSelect = document.getElementById('modeSelect');
        const immersionToggle = document.getElementById('immersionToggle');
        const immersionLabel = document.getElementById('immersionLabel');
        const actionBtn = document.getElementById('actionBtn');
        const statusText = document.getElementById('quiz-status');
        const notesGrid = document.getElementById('notesGrid');

        let currentMode = 'train';
        let targetIndex = -1;
        let isAnswering = false;

        // 初期化：ボタン生成
        function initGrid() {
            notesGrid.innerHTML = '';
            notes.forEach((note, i) => {
                const btn = document.createElement('div');
                btn.className = 'note-btn';
                btn.id = 'btn-' + i;
                btn.textContent = note;
                // 通常モード用の色設定
                btn.style.backgroundColor = `hsl(${hues[i]}, 100%, 50%)`;
                
                // マウス・タッチ両対応のイベント
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    handlePress(i);
                });
                btn.addEventListener('pointerup', (e) => {
                    e.preventDefault();
                    handleRelease(i);
                });
                btn.addEventListener('pointerleave', (e) => {
                    e.preventDefault();
                    handleRelease(i);
                });
                
                notesGrid.appendChild(btn);
            });
            updateActiveNotes(); // 選択中の音数に合わせて表示を更新
        }

        // 音の数を変更したときの表示切り替え処理
        function updateActiveNotes() {
            const count = parseInt(noteCountSelect.value);
            activeNotes = levelPatterns[count];
            
            notes.forEach((_, i) => {
                const btn = document.getElementById('btn-' + i);
                if (activeNotes.includes(i)) {
                    btn.style.display = 'flex';
                } else {
                    btn.style.display = 'none';
                }
            });
        }

        // 音数選択が変更された時の処理
        noteCountSelect.addEventListener('change', () => {
            updateActiveNotes();
            // クイズ中に変更された場合はリセット
            stopTone();
            setBgColor(-1);
            statusText.textContent = "";
            isAnswering = false;
        });

        // Web Audio API 初期化
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(index) {
            initAudio();
            stopTone(); // 前の音を確実に消す

            const freq = 440 * Math.pow(2, (index - 9) / 12); // A4(インデックス9) = 440Hz
            currentOsc = audioCtx.createOscillator();
            currentGain = audioCtx.createGain();

            currentOsc.type = 'sine';
            currentOsc.frequency.value = freq;

            currentOsc.connect(currentGain);
            currentGain.connect(audioCtx.destination);

            // クリックノイズ防止のアタックフェード
            currentGain.gain.setValueAtTime(0, audioCtx.currentTime);
            currentGain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.02);
            
            currentOsc.start();
        }

        function stopTone() {
            if (currentOsc && currentGain) {
                currentGain.gain.cancelScheduledValues(audioCtx.currentTime);
                currentGain.gain.setValueAtTime(currentGain.gain.value, audioCtx.currentTime);
                currentGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                currentOsc.stop(audioCtx.currentTime + 0.05);
                currentOsc = null;
            }
        }

        function setBgColor(index) {
            if (index === -1) {
                document.body.style.backgroundColor = '#111';
            } else {
                document.body.style.backgroundColor = `hsl(${hues[index]}, 100%, 50%)`;
            }
        }

        function handlePress(index) {
            initAudio();

            if (currentMode === 'train') {
                playTone(index);
                if (immersionToggle.checked) {
                    setBgColor(index);
                    document.body.setAttribute('data-playing', 'true');
                }
            } 
            else if (currentMode === 'quiz_sound') {
                if (isAnswering) return;
                if (index === targetIndex) {
                    isAnswering = true;
                    statusText.textContent = "正解！";
                    statusText.style.color = "#0f0";
                    playTone(index);
                    setBgColor(index); 
                } else {
                    statusText.textContent = "ハズレ...";
                    statusText.style.color = "#f00";
                }
            }
            else if (currentMode === 'quiz_color') {
                if (isAnswering) return;
                if (index === targetIndex) {
                    isAnswering = true;
                    statusText.textContent = "正解！";
                    statusText.style.color = "#0f0";
                    playTone(index); 
                } else {
                    statusText.textContent = "ハズレ...";
                    statusText.style.color = "#f00";
                }
            }
        }

        function handleRelease(index) {
            if (currentMode === 'train') {
                stopTone();
                setBgColor(-1);
                document.body.setAttribute('data-playing', 'false');
            } 
            else if (currentMode.startsWith('quiz') && isAnswering && index === targetIndex) {
                stopTone();
                setBgColor(-1);
                setTimeout(nextQuiz, 300); 
            }
        }

        function nextQuiz() {
            isAnswering = false;
            statusText.textContent = "思考中...";
            statusText.style.color = "#fff";
            setBgColor(-1);
            
            // 現在画面に表示されている音（activeNotes）の中からランダムに出題
            const randomIndex = Math.floor(Math.random() * activeNotes.length);
            targetIndex = activeNotes[randomIndex];

            if (currentMode === 'quiz_sound') {
                playTone(targetIndex);
                setTimeout(() => stopTone(), 1000); 
            } 
            else if (currentMode === 'quiz_color') {
                setBgColor(targetIndex);
            }
        }

        modeSelect.addEventListener('change', (e) => {
            currentMode = e.target.value;
            document.body.setAttribute('data-mode', currentMode);
            stopTone();
            setBgColor(-1);
            statusText.textContent = "";

            if (currentMode === 'train') {
                immersionLabel.style.display = 'block';
                actionBtn.style.display = 'none';
            } else {
                immersionLabel.style.display = 'none';
                actionBtn.style.display = 'inline-block';
                actionBtn.textContent = currentMode === 'quiz_color' ? "色を表示する" : "音を鳴らす";
            }
        });

        immersionToggle.addEventListener('change', (e) => {
            document.body.setAttribute('data-immersion', e.target.checked);
        });

        actionBtn.addEventListener('click', () => {
            initAudio();
            nextQuiz();
        });

        initGrid();
    </script>
</body>
</html>
