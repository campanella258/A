<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>色聴（共感覚）トレーニング</title>
    <style>
        :root {
            --bg-color: #111;
            --text-color: #fff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.1s ease;
            overflow: hidden;
        }
        #ui-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.1s ease;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            text-align: center;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            cursor: pointer;
        }
        button:active { background: #444; }
        
        .notes-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        .note-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid transparent;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none; /* スマホでのスクロール防止 */
            transition: transform 0.1s;
        }
        .note-btn:active {
            transform: scale(0.9);
        }

        /* 各種状態のスタイル */
        /* 1. 通常トレーニングモード（ボタンに色がつく） */
        body[data-mode="train"] .note-btn {
            color: #000;
        }
        body[data-mode="train"][data-immersion="true"] .note-btn {
            background-color: #000 !important;
            border-color: #fff;
            color: #fff;
        }
        body[data-mode="train"][data-playing="true"][data-immersion="true"] .controls {
            opacity: 0; /* 没入モード発音中はUIを消す */
        }

        /* 2. クイズモード共通（ボタンは白黒固定でネタバレ防止） */
        body[data-mode^="quiz"] .note-btn {
            background-color: #000 !important;
            border-color: #fff;
            color: #fff;
        }

        #quiz-status {
            font-size: 20px;
            font-weight: bold;
            height: 30px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body data-mode="train" data-immersion="false" data-playing="false">

    <div id="ui-container">
        <div class="controls">
            <h2>色聴トレーニング</h2>
            <select id="modeSelect">
                <option value="train">1. トレーニング (自由押し)</option>
                <option value="quiz_sound">2. クイズ: 音 → 色(音)を当てる</option>
                <option value="quiz_color">3. クイズ: 色 → 音を当てる</option>
            </select>
            
            <label id="immersionLabel">
                <input type="checkbox" id="immersionToggle"> 没入モード (発音中UI非表示＆全画面色)
            </label>

            <button id="actionBtn" style="display: none;">問題を出す</button>
            <div id="quiz-status"></div>
        </div>

        <div class="notes-grid" id="notesGrid"></div>
    </div>

    <script>
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        // C=0度(赤), C#=30度... 30度ずつ回転
        const hues = notes.map((_, i) => i * 30);
        
        let audioCtx;
        let currentOsc = null;
        let currentGain = null;

        const modeSelect = document.getElementById('modeSelect');
        const immersionToggle = document.getElementById('immersionToggle');
        const immersionLabel = document.getElementById('immersionLabel');
        const actionBtn = document.getElementById('actionBtn');
        const statusText = document.getElementById('quiz-status');
        const notesGrid = document.getElementById('notesGrid');

        let currentMode = 'train';
        let targetIndex = -1;
        let isAnswering = false;

        // 初期化：ボタン生成
        function initGrid() {
            notesGrid.innerHTML = '';
            notes.forEach((note, i) => {
                const btn = document.createElement('div');
                btn.className = 'note-btn';
                btn.textContent = note;
                // 通常モード用の色設定
                btn.style.backgroundColor = `hsl(${hues[i]}, 100%, 50%)`;
                
                // マウス・タッチ両対応のイベント
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    handlePress(i);
                });
                btn.addEventListener('pointerup', (e) => {
                    e.preventDefault();
                    handleRelease(i);
                });
                btn.addEventListener('pointerleave', (e) => {
                    e.preventDefault();
                    handleRelease(i);
                });
                
                notesGrid.appendChild(btn);
            });
        }

        // Web Audio API 初期化
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 濁り・プツッというノイズを防ぐ厳密な発音処理
        function playTone(index) {
            initAudio();
            stopTone(); // 前の音を確実に消す

            const freq = 440 * Math.pow(2, (index - 9) / 12); // A4(インデックス9) = 440Hz
            currentOsc = audioCtx.createOscillator();
            currentGain = audioCtx.createGain();

            currentOsc.type = 'sine';
            currentOsc.frequency.value = freq;

            currentOsc.connect(currentGain);
            currentGain.connect(audioCtx.destination);

            // クリックノイズ防止のアタックフェード
            currentGain.gain.setValueAtTime(0, audioCtx.currentTime);
            currentGain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.02);
            
            currentOsc.start();
        }

        function stopTone() {
            if (currentOsc && currentGain) {
                // クリックノイズ防止のリリースフェード
                currentGain.gain.cancelScheduledValues(audioCtx.currentTime);
                currentGain.gain.setValueAtTime(currentGain.gain.value, audioCtx.currentTime);
                currentGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                currentOsc.stop(audioCtx.currentTime + 0.05);
                currentOsc = null;
            }
        }

        // 背景色の変更
        function setBgColor(index) {
            if (index === -1) {
                document.body.style.backgroundColor = '#111';
            } else {
                document.body.style.backgroundColor = `hsl(${hues[index]}, 100%, 50%)`;
            }
        }

        // ボタンが押されたときの処理
        function handlePress(index) {
            initAudio();

            if (currentMode === 'train') {
                playTone(index);
                if (immersionToggle.checked) {
                    setBgColor(index);
                    document.body.setAttribute('data-playing', 'true');
                }
            } 
            else if (currentMode === 'quiz_sound') {
                if (isAnswering) return;
                if (index === targetIndex) {
                    // 正解
                    isAnswering = true;
                    statusText.textContent = "正解！";
                    statusText.style.color = "#0f0";
                    playTone(index);
                    setBgColor(index); // 正解時のみ一瞬色を見せる
                } else {
                    statusText.textContent = "ハズレ...";
                    statusText.style.color = "#f00";
                }
            }
            else if (currentMode === 'quiz_color') {
                if (isAnswering) return;
                if (index === targetIndex) {
                    // 正解
                    isAnswering = true;
                    statusText.textContent = "正解！";
                    statusText.style.color = "#0f0";
                    playTone(index); // 音を聴かせて記憶を強化
                } else {
                    statusText.textContent = "ハズレ...";
                    statusText.style.color = "#f00";
                }
            }
        }

        // ボタンを離したときの処理
        function handleRelease(index) {
            if (currentMode === 'train') {
                stopTone();
                setBgColor(-1);
                document.body.setAttribute('data-playing', 'false');
            } 
            else if (currentMode.startsWith('quiz') && isAnswering && index === targetIndex) {
                stopTone();
                setBgColor(-1);
                setTimeout(nextQuiz, 300); // 離したら少し待って次の問題へ
            }
        }

        // クイズの出題ロジック
        function nextQuiz() {
            isAnswering = false;
            statusText.textContent = "思考中...";
            statusText.style.color = "#fff";
            setBgColor(-1);
            
            // ランダムな音を決定
            targetIndex = Math.floor(Math.random() * notes.length);

            if (currentMode === 'quiz_sound') {
                // ホワイトノイズ的なリセットを挟むと相対音感対策になるが、今回はシンプルに音のみ再生
                playTone(targetIndex);
                setTimeout(() => stopTone(), 1000); // 1秒だけ鳴らす
            } 
            else if (currentMode === 'quiz_color') {
                // 音は鳴らさず、画面をその色に染める
                setBgColor(targetIndex);
            }
        }

        // モード切替時の処理
        modeSelect.addEventListener('change', (e) => {
            currentMode = e.target.value;
            document.body.setAttribute('data-mode', currentMode);
            stopTone();
            setBgColor(-1);
            statusText.textContent = "";

            if (currentMode === 'train') {
                immersionLabel.style.display = 'block';
                actionBtn.style.display = 'none';
            } else {
                immersionLabel.style.display = 'none';
                actionBtn.style.display = 'inline-block';
                actionBtn.textContent = currentMode === 'quiz_color' ? "色を表示する" : "音を鳴らす";
            }
        });

        immersionToggle.addEventListener('change', (e) => {
            document.body.setAttribute('data-immersion', e.target.checked);
        });

        actionBtn.addEventListener('click', () => {
            initAudio();
            nextQuiz();
        });

        initGrid();
    </script>
</body>
</html>
