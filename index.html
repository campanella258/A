<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共感覚（色聴）トレーニングアプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Tailwind gray-900 */
            color: #f3f4f6; /* Tailwind gray-100 */
        }
        
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto;
            border-radius: 50%;
        }

        .note-btn {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.25rem;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.3);
            transition: transform 0.1s, filter 0.2s;
            text-shadow: 0px 1px 3px rgba(0,0,0,0.8);
            color: white;
            user-select: none;
        }

        .note-btn:active {
            transform: scale(0.9);
        }

        .note-btn.playing {
            transform: scale(1.15);
            box-shadow: 0 0 20px currentColor;
            z-index: 10;
        }

        /* 画面サイズに応じたレスポンシブな円形配置用 */
        @media (min-width: 768px) {
            .wheel-container {
                width: 440px;
                height: 440px;
            }
            .note-btn {
                width: 90px;
                height: 90px;
                font-size: 1.5rem;
            }
        }
        
        .glass-panel {
            background: rgba(31, 41, 55, 0.7); /* gray-800 with opacity */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(75, 85, 99, 0.5); /* gray-600 */
            transition: opacity 0.5s ease-in;
        }

        header {
            transition: opacity 0.5s ease-in;
        }

        /* 没入モード発動中にUIを消すためのクラス */
        body.immersive-playing .glass-panel,
        body.immersive-playing header {
            opacity: 0 !important;
            transition: opacity 0s;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-3xl w-full flex flex-col gap-6">
        <!-- ヘッダー -->
        <header class="text-center">
            <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500 mb-2">
                共感覚トレーニング
            </h1>
            <p class="text-gray-400 text-sm md:text-base">音と色の結びつきを脳に学習させる実験的アプリケーション</p>
        </header>

        <!-- コントロールパネル -->
        <div class="glass-panel p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- モード切替 -->
            <div class="flex bg-gray-900 rounded-lg p-1">
                <button id="mode-training" class="px-4 py-2 rounded-md font-semibold text-sm transition-colors bg-blue-600 text-white shadow" onclick="setMode('training')">
                    トレーニングモード
                </button>
                <button id="mode-quiz" class="px-4 py-2 rounded-md font-semibold text-sm transition-colors text-gray-400 hover:text-white" onclick="setMode('quiz')">
                    クイズモード
                </button>
            </div>

            <!-- オクターブ選択 -->
            <div class="flex items-center gap-3">
                <label class="text-gray-300 font-semibold text-sm">オクターブ:</label>
                <select id="octave-select" class="bg-gray-800 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2" onchange="changeOctave(this.value)">
                    <option value="3">3 (低音 / 暗い色)</option>
                    <option value="4" selected>4 (基準 / 標準色)</option>
                    <option value="5">5 (高音 / 明るい色)</option>
                </select>
            </div>

            <!-- 没入モード切替 -->
            <div class="flex items-center gap-2 mt-2 md:mt-0 border-l border-gray-700 pl-0 md:pl-4">
                <input type="checkbox" id="immersive-toggle" class="w-5 h-5 text-blue-600 bg-gray-800 border-gray-600 rounded focus:ring-blue-500 cursor-pointer" onchange="toggleImmersiveState()">
                <label for="immersive-toggle" class="text-gray-200 font-bold text-sm cursor-pointer">没入モード</label>
            </div>
        </div>

        <!-- クイズ用ステータスパネル (クイズモード時のみ表示) -->
        <div id="quiz-panel" class="hidden glass-panel p-4 rounded-xl flex flex-col items-center gap-4">
            <div class="flex justify-between w-full max-w-sm px-4">
                <div class="text-lg font-bold">スコア: <span id="score-display" class="text-blue-400">0</span> / <span id="attempts-display">0</span></div>
                <div id="quiz-feedback" class="text-lg font-bold transition-opacity duration-300 opacity-0">正解！</div>
            </div>
            <button id="play-quiz-btn" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95" onclick="playQuizNote()">
                ▶ 問題の音を聞く
            </button>
            <p class="text-xs text-gray-400 text-center">音が鳴ったら、対応する色のボタンをタップしてください。</p>
        </div>

        <!-- メイン画面（色相環） -->
        <div class="flex-1 flex items-center justify-center py-10">
            <div id="wheel-container" class="wheel-container">
                <!-- Javascriptでボタンを生成 -->
            </div>
        </div>
    </div>

    <script>
        // === データ定義 ===
        // 音名、色相(Hue 0-360)、第4オクターブの周波数(Hz)
        const notesData = [
            { name: "C",  hue: 0,   freq: 261.63 },
            { name: "C#", hue: 30,  freq: 277.18 },
            { name: "D",  hue: 60,  freq: 293.66 },
            { name: "D#", hue: 90,  freq: 311.13 },
            { name: "E",  hue: 120, freq: 329.63 },
            { name: "F",  hue: 150, freq: 349.23 },
            { name: "F#", hue: 180, freq: 369.99 },
            { name: "G",  hue: 210, freq: 392.00 },
            { name: "G#", hue: 240, freq: 415.30 },
            { name: "A",  hue: 270, freq: 440.00 },
            { name: "A#", hue: 300, freq: 466.16 },
            { name: "B",  hue: 330, freq: 493.88 },
        ];

        // === 状態管理 ===
        let currentMode = 'training'; // 'training' or 'quiz'
        let currentOctave = 4;        // 3, 4, 5
        let audioContext = null;
        let isPlaying = false;
        let activeOsc = null;
        let activeGain = null;
        
        // クイズ用状態
        let quizTargetNote = null;
        let quizTargetOctave = null;
        let score = 0;
        let attempts = 0;
        let quizState = 'waiting'; // 'waiting', 'guessing'

        // 没入モード用状態
        let immersiveTimer = null;
        const defaultBgColor = '#111827';

        // === 初期化 ===
        window.onload = () => {
            renderWheel();
            updateColors();
        };

        function toggleImmersiveState() {
            updateColors();
        }

        // === 音声再生 (Web Audio API) ===
        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            return audioContext;
        }

        function playTone(frequency, duration = 1.0) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            
            // 前の音が鳴っていれば、短いフェードアウトをかけて停止（ノイズ・濁り防止）
            if (activeGain && activeOsc) {
                activeGain.gain.cancelScheduledValues(now);
                activeGain.gain.setValueAtTime(activeGain.gain.value, now);
                activeGain.gain.linearRampToValueAtTime(0, now + 0.05);
                
                try {
                    activeOsc.stop(now + 0.05);
                } catch (e) {
                    // すでに停止している場合のエラーを無視
                }
            }
            
            // オシレーター（サイン波生成）
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = frequency;

            // ゲイン（音量調整・クリック音防止のためのフェード処理）
            const gainNode = ctx.createGain();
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            // エンベロープ（音の立ち上がりと減衰）
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.8, now + 0.05); // Attack
            
            const releaseStartTime = Math.max(now + 0.05, now + duration - 0.1);
            gainNode.gain.setValueAtTime(0.8, releaseStartTime); // Sustain
            gainNode.gain.linearRampToValueAtTime(0, now + duration); // Release

            osc.start(now);
            osc.stop(now + duration);
            
            // 現在の音として保持
            activeOsc = osc;
            activeGain = gainNode;
        }

        // === UIレンダリング ===
        function renderWheel() {
            const container = document.getElementById('wheel-container');
            container.innerHTML = '';

            const radius = 50; // 中心からの距離 (%)
            const angleOffset = -90; // 0度が上（12時方向）になるように調整

            notesData.forEach((note, index) => {
                const button = document.createElement('button');
                button.className = 'note-btn';
                button.id = `btn-${note.name.replace('#', 'sharp')}`;
                button.innerText = note.name;
                
                // 円周上の位置計算 (角度からX,Y座標を求める)
                const angleDeg = (index * 30) + angleOffset;
                const angleRad = angleDeg * (Math.PI / 180);
                
                // transformを使って配置（中央基準）
                const x = 50 + (radius * Math.cos(angleRad));
                const y = 50 + (radius * Math.sin(angleRad));
                
                button.style.left = `calc(${x}% - 35px)`; // 幅の半分を引いて中央揃え
                button.style.top = `calc(${y}% - 35px)`;  // PC表示時の調整はCSSのメディアクエリと競合するため、ここではパーセンテージで大枠決定

                // PCサイズ時（CSSメディアクエリのサイズ変更に対応）
                const mediaQuery = window.matchMedia('(min-width: 768px)');
                if (mediaQuery.matches) {
                    button.style.left = `calc(${x}% - 45px)`;
                    button.style.top = `calc(${y}% - 45px)`;
                }

                // イベントリスナー追加（マウスとタッチ両対応）
                button.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    handleNoteClick(note, button);
                });

                container.appendChild(button);
            });
        }

        // オクターブに応じた色の明度を計算
        function getLightness(octave) {
            if (octave === 3) return 30; // 暗い
            if (octave === 4) return 50; // 標準
            if (octave === 5) return 70; // 明るい
            return 50;
        }

        // 全ボタンの色を更新
        function updateColors() {
            const isImmersive = document.getElementById('immersive-toggle').checked;
            const lightness = getLightness(currentOctave);
            
            notesData.forEach(note => {
                const button = document.getElementById(`btn-${note.name.replace('#', 'sharp')}`);
                if (button) {
                    if (isImmersive) {
                        // 没入モード中はUIとしての色は消し、黒抜きにする
                        button.style.backgroundColor = '#000000';
                        button.style.color = '#ffffff';
                        button.style.border = '2px solid #ffffff';
                        button.style.boxShadow = 'none';
                    } else {
                        // 通常時は色を付ける
                        const color = `hsl(${note.hue}, 100%, ${lightness}%)`;
                        button.style.backgroundColor = color;
                        button.style.color = 'white';
                        button.style.border = 'none';
                        button.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.3)';
                    }
                }
            });
        }

        // オクターブ変更ハンドラ
        function changeOctave(val) {
            currentOctave = parseInt(val);
            updateColors();
            
            // クイズ待機中ならボタンの色を変えた後、すぐに問題を再生し直せるようにする
            if (currentMode === 'quiz' && quizState === 'waiting' && quizTargetNote == null) {
                // 特に何もしない
            }
        }

        // 背景色を音の色に変化させる処理
        function triggerImmersiveEffect(hue, duration) {
            const isImmersive = document.getElementById('immersive-toggle').checked;
            if (!isImmersive) return;

            // 彩度100%、明度50%の純色で画面全体を染める
            const bgColor = `hsl(${hue}, 100%, 50%)`; 
            document.body.style.backgroundColor = bgColor;
            document.body.style.transition = 'background-color 0s'; // 瞬時に染める
            document.body.classList.add('immersive-playing'); // UIを隠す

            if (immersiveTimer) clearTimeout(immersiveTimer);
            
            immersiveTimer = setTimeout(() => {
                document.body.style.backgroundColor = defaultBgColor;
                document.body.style.transition = 'background-color 0.8s ease-in';
                document.body.classList.remove('immersive-playing'); // UIを戻す
            }, duration * 1000);
        }

        // === アプリケーションロジック ===

        // 音の周波数をオクターブに基づいて計算
        function getCalculatedFreq(baseFreq, octave) {
            if (octave === 3) return baseFreq / 2;
            if (octave === 4) return baseFreq;
            if (octave === 5) return baseFreq * 2;
            return baseFreq;
        }

        // モード切替
        function setMode(mode) {
            currentMode = mode;
            const btnTraining = document.getElementById('mode-training');
            const btnQuiz = document.getElementById('mode-quiz');
            const quizPanel = document.getElementById('quiz-panel');

            if (mode === 'training') {
                btnTraining.className = "px-4 py-2 rounded-md font-semibold text-sm transition-colors bg-blue-600 text-white shadow";
                btnQuiz.className = "px-4 py-2 rounded-md font-semibold text-sm transition-colors text-gray-400 hover:text-white";
                quizPanel.classList.add('hidden');
                resetQuiz();
            } else {
                btnTraining.className = "px-4 py-2 rounded-md font-semibold text-sm transition-colors text-gray-400 hover:text-white";
                btnQuiz.className = "px-4 py-2 rounded-md font-semibold text-sm transition-colors bg-purple-600 text-white shadow";
                quizPanel.classList.remove('hidden');
                resetQuiz();
            }
        }

        // 音符ボタンクリック時の処理
        function handleNoteClick(note, buttonElement) {
            // トレーニングモード
            if (currentMode === 'training') {
                const freq = getCalculatedFreq(note.freq, currentOctave);
                playTone(freq, 1.0);
                visualizePlay(buttonElement);
                
                triggerImmersiveEffect(note.hue, 1.0);
            } 
            // クイズモード
            else if (currentMode === 'quiz') {
                if (quizState !== 'guessing') return; // 問題を再生していない場合は無視

                quizState = 'waiting'; // 連続回答を防ぐ
                const isCorrect = (note.name === quizTargetNote.name);
                
                // 回答の音を鳴らす
                const freq = getCalculatedFreq(note.freq, currentOctave);
                playTone(freq, 0.8);
                visualizePlay(buttonElement);

                triggerImmersiveEffect(note.hue, 0.8);

                attempts++;
                showQuizFeedback(isCorrect);
                
                if (isCorrect) {
                    score++;
                }

                updateScoreDisplay();

                // 次の問題のためにリセット
                quizTargetNote = null;
                document.getElementById('play-quiz-btn').disabled = false;
                document.getElementById('play-quiz-btn').classList.remove('opacity-50', 'cursor-not-allowed');
                document.getElementById('play-quiz-btn').innerText = "▶ 次の問題を聞く";
            }
        }

        // ボタンの光るアニメーション
        function visualizePlay(button) {
            button.classList.add('playing');
            setTimeout(() => {
                button.classList.remove('playing');
            }, 300);
        }

        // === クイズロジック ===

        function resetQuiz() {
            score = 0;
            attempts = 0;
            quizState = 'waiting';
            quizTargetNote = null;
            updateScoreDisplay();
            document.getElementById('play-quiz-btn').disabled = false;
            document.getElementById('play-quiz-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('play-quiz-btn').innerText = "▶ 問題の音を聞く";
            document.getElementById('quiz-feedback').style.opacity = '0';
        }

        function playQuizNote() {
            // AudioContextの初期化(ユーザーアクション起因)
            getAudioContext();

            // 問題を作成
            const randomIndex = Math.floor(Math.random() * notesData.length);
            quizTargetNote = notesData[randomIndex];
            // 現在選択中のオクターブを使用（より難しくするならランダム化も可能だが、まずは現在のオクターブ内で当てる）
            quizTargetOctave = currentOctave; 

            // 音を鳴らす
            const freq = getCalculatedFreq(quizTargetNote.freq, quizTargetOctave);
            playTone(freq, 1.2);
            
            // 背景エフェクト
            triggerImmersiveEffect(quizTargetNote.hue, 1.2);

            quizState = 'guessing';
            
            // ボタンを非活性化
            const btn = document.getElementById('play-quiz-btn');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.innerText = "音を聞いて色を選んでください...";
            
            document.getElementById('quiz-feedback').style.opacity = '0';
        }

        function showQuizFeedback(isCorrect) {
            const feedbackEl = document.getElementById('quiz-feedback');
            if (isCorrect) {
                feedbackEl.innerText = "⭕️ 正解！";
                feedbackEl.className = "text-lg font-bold transition-opacity duration-300 text-green-400";
            } else {
                feedbackEl.innerText = `❌ 残念 (正解: ${quizTargetNote.name})`;
                feedbackEl.className = "text-lg font-bold transition-opacity duration-300 text-red-400";
            }
            feedbackEl.style.opacity = '1';
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('attempts-display').innerText = attempts;
        }

    </script>
</body>
</html>
